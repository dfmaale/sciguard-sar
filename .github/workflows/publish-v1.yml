name: Publish v1.0.0 release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v1.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Create immutable JMLR reproducibility release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/release-notes.md <<'EOF'
          Reproducibility release accompanying “Statistical Assurance Regions for Predictive Models Under Joint Missingness and Distribution Shift.”

          This release includes:

          - the SAR methodology and SciGuard reference implementation;
          - simulation studies and WDBC analyses;
          - the canonical reproducibility notebook;
          - aggregate MIMIC-IV outputs without restricted patient-level data;
          - the class-sensitive MIMIC-IV analysis using false-negative risk, tau_FN = 0.20, with 3 of 60 eligible environments certified by the primary exact Bonferroni procedure;
          - tests, figures, configuration files, and JMLR manuscript source.

          MIMIC-IV is credentialed and is not redistributed. Eligible users must obtain it separately from PhysioNet and follow the supplied reproduction protocol.
          EOF
          if gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v1.0.0 already exists."
          else
            gh release create v1.0.0 \
              --repo "$GITHUB_REPOSITORY" \
              --target 47dada18eef3cf13e4c60cc9fd2ce454519b19ac \
              --title "Statistical Assurance Regions — JMLR Submission Release" \
              --notes-file /tmp/release-notes.md
          fi
