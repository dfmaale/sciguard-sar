name: Publish corrective release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-corrective-release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create corrective Revision 4 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create v1.0.1
          --repo "${{ github.repository }}"
          --target c67992b67de91bb2f901c9fff18c600144e2a051
          --title "Statistical Assurance Regions — Revision 4 Corrective Release"
          --notes "Corrective reproducibility release replacing the superseded v1.0.0 project snapshot. This release contains the authoritative Revision 4 project: the 25-page JMLR manuscript, executed and path-sanitized canonical notebook, simulation and WDBC studies, completed aggregate MIMIC-IV v3.1 outputs, the reviewer-requested false-negative-risk analysis (tau_FN = 0.20; 3 of 60 eligible conditions certified), tests, figures, configurations, and reviewer-response materials. Restricted patient-level MIMIC-IV data and fitted clinical models are not redistributed."
